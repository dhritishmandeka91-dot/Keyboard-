name: Build C1 Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o c1keyboard-phase4.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd c1keyboard
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: C1Keyboard-debug-apk
          path: c1keyboard/app/build/outputs/apk/debug/*.apk
